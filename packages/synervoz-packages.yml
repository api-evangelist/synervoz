source: https://www.npmjs.com/org/synervoz, https://github.com/switchboard-sdk, https://docs.switchboard.audio/
notes: >-
  Switchboard is a client-side, cross-platform audio SDK (C++ core with Swift,
  Kotlin/Java, JavaScript/TypeScript, and React Native bindings). First-party
  client libraries are published to npm under the @synervoz org and distributed
  for Apple platforms via Swift Package Manager from the switchboard-sdk GitHub
  org. Android/Flutter binaries are distributed via the versioned download
  bundles at docs.switchboard.audio/downloads/ (no Maven Central coordinate
  found). No first-party PyPI package was found (the PyPI "switchboard" project
  is an unrelated feature-flipper).
packages:
