    registry: npm
    name: "@synervoz/switchboard-sdk-js"
    version: 0.0.16
    url: https://www.npmjs.com/package/@synervoz/switchboard-sdk-js
    install: npm install @synervoz/switchboard-sdk-js
    description: A cross-platform SDK that simplifies audio app development and saves time.
